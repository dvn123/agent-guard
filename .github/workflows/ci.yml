name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          check-latest: false
          cache: true

      - name: Run vendored Go tests
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor -count=1 ./...

      - name: Check reachable Go vulnerabilities
        if: runner.os == 'Linux'
        env:
          GOFLAGS: -mod=vendor
          GOTOOLCHAIN: local
        run: go tool govulncheck ./...

      - name: Set up Node for the OpenCode Desktop contract
        if: runner.os == 'Linux'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.5.1
          check-latest: false

      - name: Set up Bun for the OpenCode contract
        if: runner.os == 'Linux'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run isolated launcher and OpenCode adapter tests
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
        run: scripts/test-integrations.sh

      - name: Cross-build supported platforms
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: local
        run: scripts/build-all.sh "${RUNNER_TEMP}/agent-guard-builds"

      - name: Validate release configuration
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
