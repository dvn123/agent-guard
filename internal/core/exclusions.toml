# Built-in false-positive exclusions, compiled into agent-guard.
#
# A finding is dropped when its rule is listed in `rules` and some match of
# `pattern` has its single capture group containing the flagged secret. The
# group only needs to cover the secret, not the key name or delimiters the
# rule also matched. For a decoded finding (base64, hex, percent) the secret
# is not in the raw text, so the group must cover the whole encoded text.
#
# Fields, all required:
#   id           unique, kebab-case
#   description  what the value is and why it is not a secret worth blocking
#   rules        betterleaks rule IDs the exclusion applies to; keep it to the
#                rules that actually fire, never a broad list
#   pattern      Go RE2 regex with exactly one capture group; anchor it on
#                context that only the benign source produces
#   examples     realistic tool output that must be flagged without this
#                exclusion and clean with it; use fake values only
#
# Add a negative case to TestScanExclusionsStayNarrow for each new entry.

[[exclusion]]
id = "cursor-bugbot-link"
description = """
Cursor Bugbot "Fix in Cursor" and "Fix in Web" links on GitHub review comments. \
The link parameter is base64url JSON carrying per-link redisKey and encryptionKey \
fields, which generic-api-key flags after decoding. Anyone who can read the pull \
request already sees them."""
rules = ["generic-api-key"]
pattern = '''https://(?:www\.)?cursor\.com/(?:open|agents)\?link=([A-Za-z0-9_-]+=*)'''
examples = [
  '<a href="https://cursor.com/open?" target="_blank" rel="noopener noreferrer">',
  '<a href="https://cursor.com/agents?" target="_blank" rel="noopener noreferrer">',
]

[[exclusion]]
id = "atlassian-account-id"
description = """
The atlassianAccountId field in the context object of Atlassian MCP responses. \
A 24-hex Atlassian account ID is a public user identifier, but the generic \
branch of atlassian-api-token reads any 24-character value after "atlassian" \
as a token."""
rules = ["atlassian-api-token"]
pattern = '''"atlassianAccountId"\s*:\s*"([0-9a-f]{24})"'''
examples = [
  '{"data":{"issues":[]},"context":{"atlassianAccountId":"5f3a9c0e7b21d84e6c9a0f17","userEmail":"someone@example.com","cloudId":"e28499e4-c2d5-b48e-ee8d-c49896956764"}}',
]

[[exclusion]]
id = "teamcity-credentials-json"
description = """
TeamCity versioned-settings references to tokens stored on the TeamCity server. \
The UUID after credentialsJSON: names the stored token; it is not the token."""
rules = ["generic-api-key"]
pattern = '''credentialsJSON:([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'''
examples = [
  '''<param name="env.DEPLOY_AUTH_TOKEN" value="credentialsJSON:d6ed6194-3cc5-476e-e428-ba0767248f7e" spec="password display='normal'" />''',
  '''<param name="secure:accessToken" value="credentialsJSON:07ca66f7-1a1c-7a03-6c6c-f8f4de4243b3" />''',
]

[[exclusion]]
id = "gradle-cache-key"
description = """
Gradle build-cache keys and input fingerprints, in --build-cache debug logs and \
Develocity build-scan JSON. They are content hashes of task inputs."""
rules = ["generic-api-key"]
pattern = '''(?:"cacheKey"\s*:\s*"|build cache key: )([0-9a-f]{32})\b'''
examples = [
  '{"originBuildInvocationId":"6sksz4a6arcb5bhradvnqun4ni","cacheKey":"e88a8c82622d17428ea4d9124a01c0bf","originExecutionTime":42}',
  "Appending input value fingerprint for 'javaCompiler.metadata.taskInputs.implementation' to build cache key: db37fc20485e98d8bedc6ab2114d9eea\n",
]

[[exclusion]]
id = "tfe-oauth-token-id"
description = """
Terraform Cloud VCS OAuth token IDs (ot- plus 16 characters) in workspace JSON \
and HCL, under oauth-token-id or any variable name (for example \
github_token). The ID names the OAuth token stored in Terraform Cloud; it \
is not the token."""
rules = ["generic-api-key"]
pattern = '''["'](ot-[A-Za-z0-9]{16})["']'''
examples = [
  '"vcs-repo": {"identifier": "example/terraform-test-proj", "ingress-submodules": false, "oauth-token-id": "ot-9MZVGT9mRqYfjf5Z", "branch": ""}',
  "  vcs_repo {\n    identifier     = \"example/infrastructure\"\n    oauth_token_id = \"ot-YuqhH2AGWVDiSPbM\"\n  }",
  '  github_token = "ot-YuqhH2AGWVDiSPbM"',
]

[[exclusion]]
id = "databricks-app-oauth-ids"
description = """
OAuth client and integration IDs in Databricks Apps API responses. An OAuth \
client ID is a public identifier; the app's client secret is never returned."""
rules = ["generic-api-key"]
pattern = '''"oauth2_app_(?:client|integration)_id"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'''
examples = [
  "\"name\": \"example-app\",\n  \"oauth2_app_client_id\": \"e426f766-1eae-7064-9751-cd46c4f44301\",\n  \"oauth2_app_integration_id\": \"07b99418-7a60-3d65-a1c1-e75aab8af89d\",\n  \"resources\": []",
]

[[exclusion]]
id = "java-tool-options-truststore-password"
description = """
The javax.net.ssl.trustStorePassword system property in JAVA_TOOL_OPTIONS, in \
the "Picked up JAVA_TOOL_OPTIONS:" notice every JVM prints to stderr and in \
environment dumps. A truststore holds only public CA certificates; its \
password guards the file's integrity, not anything confidential. \
keyStorePassword, which protects private keys, stays flagged."""
rules = ["generic-api-key"]
pattern = '''(?:Picked up JAVA_TOOL_OPTIONS:|JAVA_TOOL_OPTIONS=)[^\n]*?-Djavax\.net\.ssl\.trustStorePassword=([^\s"']+)'''
examples = [
  "Picked up JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/Users/someone/.certs/java-cacerts -Djavax.net.ssl.trustStorePassword=DmCVP1sWaNr54bvl\nopenjdk version \"21.0.11\" 2026-04-21\n",
  "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/Users/someone/.certs/java-cacerts -Djavax.net.ssl.trustStorePassword=DmCVP1sWaNr54bvl -Xmx2g\n",
]
