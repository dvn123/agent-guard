[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/bin/sh -c 'if [ -z \"${HOME:-}\" ]; then HOME=$(cd ~ 2>/dev/null && pwd) || exit 2; export HOME; fi; exec \"$HOME/.config/agent-guard/run.sh\" --tool codex'"
timeout = 10
statusMessage = "Checking for secrets"

[[hooks.PostToolUse]]
matcher = "*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/bin/sh -c 'if [ -z \"${HOME:-}\" ]; then HOME=$(cd ~ 2>/dev/null && pwd) || exit 2; export HOME; fi; exec \"$HOME/.config/agent-guard/run.sh\" --tool codex'"
timeout = 6
statusMessage = "Checking secret output"
